name: 同步我的地圖

on:
  workflow_dispatch:
  push:
    paths: [map-source.txt]
  schedule:
    - cron: '17 20 * * *'   # 每天台灣時間 04:17

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 下載 KML
        run: |
          MID=$(grep -o 'mid=[^&[:space:]]*' map-source.txt | head -1 | cut -d= -f2)
          [ -z "$MID" ] && MID=$(tr -d '[:space:]' < map-source.txt)
          echo "mid=$MID"
          curl -fsSL "https://www.google.com/maps/d/kml?mid=${MID}&forcekml=1" -o new.kml
          if ! grep -q '<Placemark' new.kml; then
            echo "下載到的檔案沒有點位，請確認地圖已設為「知道連結的人都能檢視」"; head -c 500 new.kml; exit 1
          fi
          echo "點位數：$(grep -c '<Placemark' new.kml)"
          mv new.kml map.kml
      - name: 有變更才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add map.kml
          git diff --cached --quiet && echo "沒有變更" || (git commit -m "同步我的地圖圖資" && git push)
