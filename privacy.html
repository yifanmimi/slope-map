<h1>隱私權政策</h1>
<p>「邊坡圖資編號查詢」是內部使用的圖資查詢工具。</p>
<p>使用者以 Google 帳號登入時，本工具只取得登入帳號的電子郵件地址，用來確認是否具有查看或更換圖資的權限，不會取得其他個人資料，也不會儲存、分享或出售使用者資料。</p>
<p>使用「我的位置」功能時，定位資訊只在使用者的瀏覽器內顯示於地圖上，不會傳送或儲存。</p>
