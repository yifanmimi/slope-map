<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>邊坡圖資編號查詢</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="邊坡圖資">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#1f6f5c">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d2320;--mute:#6b736f;--line:#dcdfdb;--acc:#1f6f5c;--acc2:#e3f1ec;--hi:#d9480f}
@media (prefers-color-scheme:dark){:root{--bg:#141716;--card:#1d2120;--ink:#e8ece9;--mute:#9aa39e;--line:#2f3532;--acc:#5cc2a3;--acc2:#1e3a32;--hi:#ff8a4c}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
body{position:fixed;top:0;left:0;right:0;bottom:0;width:auto;height:auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:0;box-sizing:border-box;touch-action:manipulation;background:var(--card)}
#detail{padding-bottom:env(safe-area-inset-bottom)}
/* iPhone 主畫面模式：版面高度會少算狀態列，改用整個螢幕高度 */
.leaflet-bottom{margin-bottom:env(safe-area-inset-bottom)}
header,#results,#detail{flex:none}
#detail{max-height:38dvh!important}
#results{max-height:34dvh!important}
header{padding:16px 12px 8px;background:var(--card);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:8px}
.title{flex:1;min-width:0}
.title b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.search{display:flex;gap:8px;margin-top:8px}
.search .qw{flex:1;min-width:0;position:relative;display:flex}
.search input{flex:1;min-width:0;padding-right:40px!important;font-size:20px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);outline:none}
.search input:focus{border-color:var(--acc)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
#qx{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;border-radius:50%;background:var(--line);color:var(--ink);font-size:15px;line-height:30px;padding:0;cursor:pointer;display:none}
#results{max-height:34vh;overflow:auto;background:var(--card);border-bottom:1px solid var(--line);display:none}
.r{padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.r:active,.r:hover{background:var(--acc2)}
.r b{font-size:15px}.r span{color:var(--mute);font-size:12px;margin-left:6px}
.note{padding:10px 14px;color:var(--mute);font-size:13px}
#map{flex:1;min-height:200px;background:#e9ece8}
@media (prefers-color-scheme:dark){#map{background:#202624}}
#detail{background:var(--card);border-top:1px solid var(--line);max-height:42vh;overflow:auto;display:none}
#detail .dh{position:sticky;top:0;background:var(--card);display:flex;align-items:center;gap:6px;padding:10px 10px 6px 14px;cursor:pointer;z-index:1}
#detail .dh h3{flex:1;min-width:0;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#detail .ib{border:0;background:var(--bg);color:var(--ink);border-radius:50%;width:34px;height:34px;font-size:16px;line-height:34px;text-align:center;cursor:pointer;flex:none;padding:0}
#detail .db{padding:0 14px 12px}
#detail.min .db{display:none}
#detail h3{font-size:18px}
#detail .meta{color:var(--mute);font-size:12px;margin-bottom:8px}
#detail table{border-collapse:collapse;width:100%;font-size:14px;margin:6px 0}
#detail td{border-top:1px solid var(--line);padding:5px 4px;vertical-align:top}
#detail td:first-child{color:var(--mute);white-space:nowrap;width:1%;padding-right:10px}
#detail .desc{font-size:14px;white-space:pre-wrap;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
a.btn{text-decoration:none;display:inline-block}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:2000;padding:16px}
.panel{background:var(--card);border-radius:16px;max-width:460px;width:100%;padding:18px;max-height:90vh;overflow:auto}
.panel h2{margin:0 0 8px;font-size:18px}
.panel ol{padding-left:20px;margin:8px 0;font-size:14px;line-height:1.7}
.panel p{font-size:14px;line-height:1.6;margin:8px 0}
#msg{font-size:14px;margin-top:8px;min-height:1.2em}
.leaflet-control-layers{font-size:14px}
.acl{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.acl .em{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acl select,.acl button{font-size:13px;padding:5px 8px}
.acl .tag{color:var(--mute);font-size:12px}
.leaflet-bar a.locbtn{display:flex!important;align-items:center;justify-content:center;padding:0;background:#fff;cursor:pointer;color:#222}
.leaflet-bar a.locbtn svg{width:20px;height:20px;display:block}
.leaflet-bar a.locbtn.on{color:#1a73e8}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:500;pointer-events:none}
.empty div{background:var(--card);padding:16px 18px;border-radius:14px;max-width:300px;text-align:center;font-size:14px;line-height:1.6;pointer-events:auto;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.leaflet-tooltip.lbl{background:transparent;border:0;box-shadow:none;color:var(--ink);font-size:11px;font-weight:600;padding:0;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg)}
.leaflet-tooltip.lbl:before{display:none}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="title"><b id="mapName">邊坡圖資編號查詢</b><small id="mapInfo">載入中⋯</small></div>
    <button class="btn" id="openUpload" style="display:none">管理</button>
    <button class="btn" id="acct" style="display:none" title="登出">登出</button>
  </div>
  <form class="search" id="sf">
    <div class="qw"><input id="q" type="search" inputmode="search" placeholder="輸入編號，例如 NO035 或序號 310" autocomplete="off"><button type="button" id="qx" aria-label="清除">✕</button></div>
    <button class="btn pri" type="submit">定位</button>
  </form>
</header>
<div id="results"></div>
<div style="position:relative;flex:1;min-height:0;display:flex;flex-direction:column">
  <div id="map"></div>
  <div class="empty" id="empty" style="display:none"><div id="emptyMsg">還沒有圖資。</div></div>
</div>
<div id="detail"></div>

<div class="overlay" id="login" style="display:flex;background:var(--bg)">
  <div class="panel" style="text-align:center">
    <h2>邊坡圖資編號查詢</h2>
    <p id="loginMsg">請用已授權的 Google 帳號登入。</p>
    <div id="gbtn" style="display:flex;justify-content:center;margin:14px 0"></div>
  </div>
</div>
<div class="overlay" id="ov">
  <div class="panel">
    <h2>更換圖資</h2>
    <p><b>方法一：從我的地圖同步</b><br>貼上我的地圖網址（地圖要開「知道連結的人可以檢視」）。</p>
    <input id="src" type="url" style="width:100%;font-size:14px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)">
    <div class="row"><button class="btn pri" id="syncBtn">立即同步</button></div>
    <p style="margin-top:16px"><b>方法二：上傳 KML / KMZ 檔</b><br>我的地圖（電腦版）→ 地圖名稱旁「⋮」→「匯出至 KML/KMZ」，選整份地圖，不要勾「保持資料在最新狀態」。</p>
    <input type="file" id="file" accept=".kml,.kmz,application/vnd.google-earth.kml+xml,application/vnd.google-earth.kmz">
    <div id="msg"></div>
    <h2 style="margin-top:22px;padding-top:16px;border-top:1px solid var(--line)">權限管理</h2>
    <p style="color:var(--mute);font-size:13px;margin-top:0">查看＝可以查詢；編輯＝可以換圖和管理權限。名單同步存在試算表 <a id="aclSheet" href="#" target="_blank" rel="noopener">邊坡圖資權限</a>。</p>
    <div id="aclList" style="font-size:14px"></div>
    <form id="aclAdd" class="row" style="align-items:center">
      <input id="aclEmail" type="email" placeholder="輸入 Gmail 帳號" required style="flex:1;min-width:160px;font-size:15px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)">
      <select id="aclRole" class="btn"><option value="view">查看</option><option value="edit">編輯</option></select>
      <button class="btn pri" type="submit">新增</button>
    </form>
    <div id="aclMsg" style="font-size:13px;min-height:1.2em;margin-top:6px"></div>
    <div class="row"><button class="btn" id="closeUpload">關閉</button></div>
  </div>
</div>

<script src="config.js?v=20261112k"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
// ---------- 自動檢查新版 ----------
const APP_VER='20261112-2245';
async function checkUpdate(){
  try{
    const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const v=(await r.json()).v;
    if(v&&v!==APP_VER&&!document.getElementById('upd')){
      const b=document.createElement('button');b.id='upd';b.textContent='有新版本，點這裡更新';
      b.style.cssText='position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:3000;background:#1a73e8;color:#fff;border:0;border-radius:999px;padding:12px 20px;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.3)';
      b.onclick=()=>location.replace(location.pathname+'?v='+encodeURIComponent(v));
      document.body.appendChild(b);
    }
  }catch(e){}
}
addEventListener('load',checkUpdate);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate()});
// 舊的主畫面捷徑（狀態列透明模式）會少算高度，改用螢幕高度補齊
(function(){
  if(!navigator.standalone)return;
  const probe=document.createElement('div');probe.style.cssText='position:fixed;top:0;height:env(safe-area-inset-top);visibility:hidden';document.documentElement.appendChild(probe);
  const fix=()=>{const top=probe.offsetHeight;if(top<1)return;const H=matchMedia('(orientation: portrait)').matches?screen.height:screen.width;document.body.style.bottom='auto';document.body.style.height=H+'px'};
  addEventListener('DOMContentLoaded',fix);addEventListener('orientationchange',()=>setTimeout(fix,300));if(document.body)fix();
})();
addEventListener('orientationchange',()=>setTimeout(()=>window.scrollTo(0,0),300));
let DATA=null; // {name, updatedAt, points:[...]}
let db=null, canWrite=null;
const LS_KEY='slope-map-local-v1';

// ---------- map ----------
// 全部向量圖層共用同一張畫布；多張畫布疊在一起時，上面那張會擋住下面的點擊
const vecR=L.canvas({tolerance:6});
const map=L.map('map',{zoomControl:true,renderer:vecR,maxZoom:20}).setView([24.99,121.57],13);
const nlsc=(id,ext)=>L.tileLayer('https://wmts.nlsc.gov.tw/wmts/'+id+'/default/GoogleMapsCompatible/{z}/{y}/{x}',Object.assign({maxZoom:20,maxNativeZoom:19,attribution:'國土測繪中心'},ext||{}));
const bases={
  '國土測繪 電子地圖':nlsc('EMAP'),
  '國土測繪 電子地圖＋等高線':nlsc('EMAP5'),
  '國土測繪 正射影像':nlsc('PHOTO2',{maxNativeZoom:20}),
  '國土測繪 地形暈渲（高程）':nlsc('MOI_HILLSHADE',{maxNativeZoom:16}),
  'OpenTopoMap 地形圖':L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{subdomains:'abc',maxZoom:20,maxNativeZoom:17,attribution:'© OpenTopoMap (CC-BY-SA)'}),
  'OpenStreetMap':L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,maxNativeZoom:19,attribution:'© OpenStreetMap'})
};
bases['國土測繪 電子地圖'].addTo(map);
const layerCtl=L.control.layers(bases,{'等高線疊加（國土測繪）':nlsc('EMAP5',{opacity:.55})},{position:'topright'}).addTo(map);
// Google 底圖（需在伺服器設定 Map Tiles API 金鑰）
function addGoogleLayers(g){
  if(!g||!g.key) return;
  const names={roadmap:'Google 街道圖',satellite:'Google 衛星圖',terrain:'Google 地形圖'};
  Object.entries(names).forEach(([t,label])=>{
    const ses=g.sessions&&g.sessions[t]; if(!ses) return;
    layerCtl.addBaseLayer(L.tileLayer('https://tile.googleapis.com/v1/2dtiles/{z}/{x}/{y}?session='+encodeURIComponent(ses)+'&key='+encodeURIComponent(g.key),{maxZoom:20,maxNativeZoom:t==='terrain'?15:20,attribution:'© Google'}),label);
  });
}
// 縮放動畫中呼叫 setView 會被 Leaflet 忽略，等動畫結束再跳
function goTo(ll,z){ if(map._animatingZoom){map.once('zoomend',()=>goTo(ll,z));return} map.setView(ll,z); }
map.attributionControl.setPrefix(false);
// 圖層順序：面、線在下，點在上，選取標記最上
// 先畫面和線、再畫點，點擊時會先選到上層的點
map.createPane('hi').style.zIndex=640;
map.getPane('hi').style.pointerEvents='none';
// ---------- 現在位置 ----------
let me=null, meAcc=null, following=false, firstFix=false;
const LocCtl=L.Control.extend({options:{position:'topleft'},onAdd(){
  const d=L.DomUtil.create('div','leaflet-bar');
  const a=L.DomUtil.create('a','locbtn',d); a.href='#'; a.title='我的位置';
  a.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>';
  L.DomEvent.on(a,'click',e=>{L.DomEvent.preventDefault(e);L.DomEvent.stopPropagation(e);
    if(following&&me){goTo(me.getLatLng(),Math.max(map.getZoom(),17));return}
    following=true;firstFix=false;a.classList.add('on');
    map.locate({watch:true,enableHighAccuracy:true,setView:false,maximumAge:5000});
  });
  return d;}});
map.addControl(new LocCtl());
map.on('locationfound',e=>{
  if(!me){me=L.circleMarker(e.latlng,{radius:8,color:'#fff',weight:3,fillColor:'#1a73e8',fillOpacity:1,pane:'hi',interactive:false}).addTo(map);
    meAcc=L.circle(e.latlng,{radius:e.accuracy,color:'#1a73e8',weight:1,fillOpacity:.1,interactive:false,pane:'hi'}).addTo(map)}
  else{me.setLatLng(e.latlng);meAcc.setLatLng(e.latlng).setRadius(e.accuracy)}
  me.bindTooltip('我的位置（誤差約 '+Math.round(e.accuracy)+' 公尺）');
  if(!firstFix){firstFix=true;goTo(e.latlng,Math.max(map.getZoom(),17))}
});
map.on('locationerror',e=>{following=false;document.querySelector('.locbtn')?.classList.remove('on');
  showToast(e.code===1?'沒有定位權限，請在瀏覽器設定允許此網站使用位置':'目前無法取得位置')});
function showToast(t){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;z-index:3000;max-width:90%';document.body.appendChild(el)}el.textContent=t;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',3500)}
const layerAll=L.layerGroup().addTo(map);
let hiLayer=null, markers=[];
const css=getComputedStyle(document.documentElement);
const ACC=()=>css.getPropertyValue('--acc').trim()||'#1f6f5c';
const HI=()=>css.getPropertyValue('--hi').trim()||'#d9480f';
const PALETTE=['#1f6f5c','#2b6cb0','#9c4221','#6b46c1','#b7791f','#2c7a7b','#c53030','#4a5568','#2f855a','#975a16'];

// 點擊時找最近的點（24px 內），點優先於面和線
function nearestPt(cp){
  let best=-1,bd=24*24;
  DATA.points.forEach((p,i)=>{if(p.g!=='pt')return;const q=map.latLngToContainerPoint(p.c);const d=(q.x-cp.x)**2+(q.y-cp.y)**2;if(d<bd){bd=d;best=i}});
  return best;
}
function render(){
  layerAll.clearLayers(); markers=[]; if(hiLayer){map.removeLayer(hiLayer);hiLayer=null}
  $('detail').style.display='none';
  if(!DATA||!DATA.points.length){
    $('empty').style.display='flex';
    $('mapName').textContent='邊坡圖資編號查詢';
    $('mapInfo').textContent='尚無圖資';
    return;
  }
  $('empty').style.display='none';
  $('mapName').textContent=DATA.name||'邊坡圖資編號查詢';
  document.title=(DATA.name||'邊坡圖資')+'｜編號查詢';
  const d=DATA.updatedAt?new Date(DATA.updatedAt):null;
  $('mapInfo').textContent=DATA.points.length+' 筆'+(d?'・更新於 '+d.toLocaleDateString('zh-TW'):'')+(DATA.local?'・僅存在這台裝置':'');
  const layers=[...new Set(DATA.points.map(p=>p.l))];
  const bounds=[];
  const order=DATA.points.map((p,i)=>i).sort((a,b)=>(DATA.points[a].g==='pt')-(DATA.points[b].g==='pt'));
  order.forEach(i=>{const p=DATA.points[i];
    const col=p.s||PALETTE[layers.indexOf(p.l)%PALETTE.length];
    let m;
    if(p.g==='line'&&p.k) m=L.polyline(p.k,{color:col,weight:3,renderer:vecR});
    else if(p.g==='poly'&&p.k) m=L.polygon(p.k,{color:col,weight:2,fillOpacity:.15,renderer:vecR});
    else m=L.circleMarker(p.c,{radius:6,color:'#fff',weight:1.5,fillColor:col,fillOpacity:.95,renderer:vecR});
    m.on('click',ev=>{L.DomEvent.stopPropagation(ev);const n=nearestPt(ev.containerPoint);select(n>=0?n:i,false)});
    m.addTo(layerAll); markers.push(m); bounds.push(p.c);
  });
  if(bounds.length) map.fitBounds(bounds,{padding:[20,20],animate:false});
  updateLabels();
}
// labels only when zoomed in enough, to keep 1000 points readable
let labelLayer=L.layerGroup().addTo(map);
function updateLabels(){
  labelLayer.clearLayers();
  if(!DATA) return;
  const z=map.getZoom(), b=map.getBounds();
  if(z<16) return;
  let n=0;
  for(const p of DATA.points){
    if(!b.contains(p.c)) continue;
    if(p.n==='(未命名)') continue;
    if(++n>300) break;
    L.tooltip({permanent:true,direction:'right',className:'lbl',offset:[6,0]}).setLatLng(p.c).setContent(esc(p.n)).addTo(labelLayer);
  }
}
map.on('zoomend moveend',updateLabels);
map.on('click',e=>{
  const ll=e.latlng.lat.toFixed(6)+','+e.latlng.lng.toFixed(6);
  L.popup().setLatLng(e.latlng).setContent(`<a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${ll}" target="_blank" rel="noopener">這裡的街景</a>`).openOn(map);
});

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

let detailMin=false;
function select(i,fly=true){
  const p=DATA.points[i];
  if(hiLayer) map.removeLayer(hiLayer);
  hiLayer=L.layerGroup([
    L.circleMarker(p.c,{radius:16,color:HI(),weight:3,fill:false,pane:'hi',interactive:false}),
    L.circleMarker(p.c,{radius:7,color:'#fff',weight:2,fillColor:HI(),fillOpacity:1,pane:'hi',interactive:false})
  ]).addTo(map);
  if(fly) goTo(p.c,Math.max(map.getZoom(),17));
  const rows=Object.entries(p.f||{}).filter(([k,v])=>v!==''&&v!=null).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('');
  const ll=p.c[0].toFixed(6)+','+p.c[1].toFixed(6);
  $('detail').innerHTML=`<div class="dh" id="dh"><h3>${esc(p.n)}</h3><button class="ib" id="dmin" aria-label="收合">${detailMin?'▴':'▾'}</button><button class="ib" id="dclose" aria-label="關閉">✕</button></div><div class="db"><div class="meta">${esc(p.l)}・${ll}</div>`+
    (p.d?`<div class="desc">${esc(p.d)}</div>`:'')+(rows?`<table>${rows}</table>`:'')+
    `<div class="row"><a class="btn pri" href="https://www.google.com/maps/search/?api=1&query=${ll}" target="_blank" rel="noopener">在 Google 地圖開啟</a>`+
    `<a class="btn pri" href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${ll}" target="_blank" rel="noopener">街景</a>`+
    `<a class="btn" href="https://www.google.com/maps/dir/?api=1&destination=${ll}" target="_blank" rel="noopener">導航</a>`+
    `<button class="btn" id="cpy">複製座標</button></div></div>`;
  $('detail').style.display='block';
  $('detail').classList.toggle('min',detailMin);
  const tog=()=>{detailMin=!detailMin;$('detail').classList.toggle('min',detailMin);$('dmin').textContent=detailMin?'▴':'▾';$('detail').scrollTop=0;setTimeout(()=>map.invalidateSize(),50)};
  $('dh').onclick=e=>{if(e.target.id!=='dclose')tog()};
  $('dmin').onclick=e=>{e.stopPropagation();tog()};
  $('dclose').onclick=e=>{e.stopPropagation();$('detail').style.display='none';if(hiLayer){map.removeLayer(hiLayer);hiLayer=null}setTimeout(()=>map.invalidateSize(),50)};
  const cb=$('cpy'); cb.onclick=()=>{try{navigator.clipboard.writeText(ll).then(()=>cb.textContent='已複製',()=>cb.textContent=ll)}catch(e){cb.textContent=ll}};
  setTimeout(()=>map.invalidateSize(),50);
}

// ---------- search ----------
function norm(s){return String(s??'').replace(/[！-～]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/　/g,' ').trim().toUpperCase()}
const IDKEY=/編號|序號|號碼|編碼|代碼|^ID$|ID$|^NO|NAME$|^SNUM$|^IDNO$|SN碼|樁號|^POS/i;
function strip0(v){return v.replace(/^[A-Z]*-?/,'').replace(/^0+(?=\d)/,'')}
function search(qRaw){
  const q=norm(qRaw); if(!q||!DATA) return {exact:[],part:[]};
  const qs=strip0(q);
  const exact=[],part=[];
  DATA.points.forEach((p,i)=>{
    const vals=[['名稱',p.n],...Object.entries(p.f||{}).filter(([k])=>IDKEY.test(k))].map(([k,v])=>[k,norm(v)]).filter(([,v])=>v);
    let hit=null;
    for(const [k,v] of vals){ if(v===q||(qs&&/\d/.test(qs)&&strip0(v)===qs)){hit=k;break} }
    if(hit){exact.push([i,hit]);return}
    if(q.length>=2&&(vals.some(([,v])=>v.includes(q))||Object.values(p.f||{}).some(v=>norm(v).includes(q)))) part.push([i,'']);
  });
  return {exact,part};
}
function showResults(res,q){
  const box=$('results');
  if(!q){box.style.display='none';return}
  const {exact,part}=res; let h='';
  if(!exact.length&&!part.length) h=`<div class="note">找不到「${esc(q)}」</div>`;
  else{
    const item=([i,tag])=>{const p=DATA.points[i];const tv=tag&&tag!=='名稱'?tag+' '+(p.f[tag]||''):'';return `<div class="r" data-i="${i}"><b>${esc(p.n)}</b><span>${esc(p.l)}${tv?'・'+esc(tv):''}</span></div>`};
    h=`<div class="note">符合 ${exact.length} 筆</div>`+exact.slice(0,100).map(item).join('');
    if(!exact.length) h='';
    if(part.length) h+=`<div class="note">部分符合（${part.length}）</div>`+part.slice(0,50).map(item).join('');
  }
  box.innerHTML=h; box.style.display='block';
  box.querySelectorAll('.r').forEach(el=>el.onclick=()=>{select(+el.dataset.i);box.style.display='none';$('q').blur()});
}
$('sf').addEventListener('submit',e=>{
  e.preventDefault(); const q=$('q').value; const res=search(q);
  if(!DATA){return}
  if(res.exact&&res.exact.length===1){select(res.exact[0][0]);$('results').style.display='none';$('q').blur()}
  else showResults(res,q);
});
const syncQx=()=>{$('qx').style.display=$('q').value?'block':'none'};
$('qx').onclick=()=>{$('q').value='';syncQx();$('results').style.display='none';$('q').focus()};
$('q').addEventListener('input',syncQx);
$('q').addEventListener('input',()=>{const q=$('q').value; if(!q.trim()){$('results').style.display='none';return} showResults(search(q),q)});

// ---------- KML parsing ----------
function txt(el,tag){const x=el.getElementsByTagName(tag)[0];return x?x.textContent.trim():''}
function stripHtml(s){if(!s)return'';const d=new DOMParser().parseFromString('<div>'+s.replace(/<br\s*\/?>/gi,'\n')+'</div>','text/html');return (d.body.textContent||'').replace(/\n{3,}/g,'\n\n').trim()}
function coordsOf(s){return s.trim().split(/\s+/).map(t=>t.split(',').map(Number)).filter(a=>a.length>=2&&isFinite(a[0])&&isFinite(a[1])).map(a=>[+a[1].toFixed(6),+a[0].toFixed(6)])}
function thin(arr,max){if(arr.length<=max)return arr;const step=arr.length/max,out=[];for(let i=0;i<max;i++)out.push(arr[Math.floor(i*step)]);out.push(arr[arr.length-1]);return out}
const NAMEKEYS=['NoName','ASName','NEW NAME','POS_1','NoID','NOID','IDNo','序號'];
function parseKML(text){
  const xml=new DOMParser().parseFromString(text,'application/xml');
  if(xml.getElementsByTagName('parsererror').length) throw new Error('KML 檔案格式讀不懂');
  if(!xml.getElementsByTagName('Placemark').length&&xml.getElementsByTagName('NetworkLink').length) throw new Error('這是「保持資料在最新狀態」的連結檔，裡面沒有點位。請重新匯出，不要勾那個選項。');
  const doc=xml.getElementsByTagName('Document')[0];
  let name='';
  if(doc){for(const c of doc.children){if(c.localName==='name'){name=c.textContent.trim();break}}}
  const pts=[];
  for(const pm of xml.getElementsByTagName('Placemark')){
    let layer='';
    let par=pm.parentElement;
    while(par){if(par.localName==='Folder'){for(const c of par.children){if(c.localName==='name'){layer=c.textContent.trim();break}}break}par=par.parentElement}
    const f={};
    for(const d of pm.getElementsByTagName('Data')){const k=(d.getAttribute('name')||'').replace(/\uFFFD/g,'').trim();const v=txt(d,'value');if(k&&!/^gx_media_links$/i.test(k))f[k]=v.slice(0,300)}
    for(const d of pm.getElementsByTagName('SimpleData')){const k=d.getAttribute('name');if(k)f[k]=d.textContent.trim().slice(0,300)}
    let desc=stripHtml(txt(pm,'description')).replace(/\uFFFD/g,'');
    // My Maps puts "key: value" lines in description too; drop duplicates of ExtendedData
    if(Object.keys(f).length){desc=desc.split('\n').filter(line=>{const m=line.match(/^([^:：]+)[:：]\s*(.*)$/);return !(m&&f[m[1].trim()]!==undefined)}).join('\n').trim()}
    for(const k of Object.keys(f)){const v=String(f[k]).replace(/\uFFFD/g,'');f[k]=v}
    let g='pt',c=null,k=null;
    const pt=pm.getElementsByTagName('Point')[0], ls=pm.getElementsByTagName('LineString')[0], pg=pm.getElementsByTagName('Polygon')[0];
    if(pt){c=coordsOf(txt(pt,'coordinates'))[0]}
    else if(ls){k=thin(coordsOf(txt(ls,'coordinates')),150);g='line';c=k[Math.floor(k.length/2)]}
    else if(pg){const ob=pg.getElementsByTagName('outerBoundaryIs')[0]||pg;k=thin(coordsOf(txt(ob,'coordinates')),150);g='poly';
      if(k.length){let a=0,b=0;k.forEach(q=>{a+=q[0];b+=q[1]});c=[+(a/k.length).toFixed(6),+(b/k.length).toFixed(6)]}}
    if(!c) continue;
    let nm=txt(pm,'name').replace(/\uFFFD/g,'');
    if(!nm){for(const key of NAMEKEYS){if(f[key]){nm=key==='POS_1'&&f.IDNo?f.IDNo+'-'+f[key]:f[key];break}}}
    const o={n:nm||'(未命名)',l:layer||'圖層',c,g};
    const sm=(txt(pm,'styleUrl').match(/-([0-9A-F]{6})-/i)||[])[1]; if(sm)o.s='#'+sm;
    if(k&&g!=='pt')o.k=k;
    if(desc)o.d=desc.slice(0,500);
    if(Object.keys(f).length)o.f=f;
    pts.push(o);
  }
  if(!pts.length) throw new Error('檔案裡找不到任何點位');
  return {name,points:pts};
}
async function readFile(file){
  if(/\.kmz$/i.test(file.name)||file.type.includes('kmz')){
    const zip=await JSZip.loadAsync(file);
    const k=Object.keys(zip.files).find(n=>/\.kml$/i.test(n));
    if(!k) throw new Error('KMZ 裡找不到 KML');
    return zip.files[k].async('string');
  }
  return file.text?file.text():new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsText(file)});
}

// ---------- 登入與後台 ----------
const CFG=window.SLOPE_CONFIG||{};
const TOKEN_KEY='slope-map-token';
let token=null;
try{const t=JSON.parse(localStorage.getItem(TOKEN_KEY)||'null');if(t&&t.exp*1000>Date.now()+60000)token=t.v}catch(e){}
function jwtPayload(t){try{return JSON.parse(decodeURIComponent(escape(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))))}catch(e){return{}}}
function setToken(t){token=t;try{t?localStorage.setItem(TOKEN_KEY,JSON.stringify({v:t,exp:jwtPayload(t).exp})):localStorage.removeItem(TOKEN_KEY)}catch(e){}}
function showLogin(msg){
  $('login').style.display='flex'; if(msg)$('loginMsg').textContent=msg;
  const go=()=>{
    if(!(window.google&&google.accounts&&google.accounts.id)){setTimeout(go,200);return}
    google.accounts.id.initialize({client_id:CFG.CLIENT_ID,callback:r=>{setToken(r.credential);$('login').style.display='none';boot()},auto_select:true,cancel_on_tap_outside:false});
    $('gbtn').innerHTML='';
    google.accounts.id.renderButton($('gbtn'),{theme:'filled_blue',size:'large',text:'signin_with',shape:'pill',locale:'zh-TW'});
    google.accounts.id.prompt();
  };
  go();
}
async function api(action,extra){
  if(!token){showLogin();throw new Error('請先登入')}
  const r=await fetch(CFG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,token},extra||{}))});
  const j=await r.json();
  if(j.error==='TOKEN'){setToken(null);showLogin('登入已過期，請重新登入。');throw new Error('登入已過期')}
  if(j.error==='NO_ACCESS'){setToken(null);try{google.accounts.id.disableAutoSelect()}catch(e){}showLogin(j.message);throw new Error(j.message)}
  if(j.error) throw new Error(j.message||j.error);
  return j;
}
function errText(e){return (e&&e.message)||String(e)}
$('acct').onclick=()=>{setToken(null);try{google.accounts.id.disableAutoSelect()}catch(e){}DATA=null;render();$('acct').style.display='none';$('openUpload').style.display='none';showLogin('已登出。')};

async function saveParsed(parsed){
  const json=JSON.stringify({name:parsed.name,points:parsed.points});
  $('msg').textContent='上傳中⋯';
  const r=await api('save',{data:json});
  DATA={name:parsed.name,updatedAt:r.updated,points:parsed.points};render();
  $('msg').textContent=`完成，共 ${parsed.points.length} 筆，所有人重新整理後就會看到新版。`;
}
$('file').addEventListener('change',async e=>{
  const file=e.target.files[0]; if(!file) return;
  const msg=$('msg'); msg.style.color=''; msg.textContent='讀取中⋯';
  try{await saveParsed(parseKML(await readFile(file)))}
  catch(err){msg.style.color='var(--hi)';msg.textContent=errText(err)||'讀取失敗'}
  e.target.value='';
});
$('syncBtn').onclick=async()=>{
  const msg=$('msg'); msg.style.color=''; msg.textContent='從我的地圖下載中⋯';
  try{const r=await api('fetchMyMaps',{url:$('src').value.trim()}); await saveParsed(parseKML(r.kml))}
  catch(err){msg.style.color='var(--hi)';msg.textContent=errText(err)}
};
$('openUpload').onclick=()=>{$('msg').textContent='';$('aclMsg').textContent='';$('ov').style.display='flex';loadAcl()};
let ME='';
function aclRender(r){
  $('aclSheet').href=r.sheetUrl||'#';
  const rows=[{email:r.owner,role:'edit',owner:true},...r.rows.filter(x=>x.email!==r.owner)];
  $('aclList').innerHTML=rows.map(x=>{
    const self=x.email===ME;
    const lock=x.owner||self;
    return `<div class="acl" data-e="${esc(x.email)}"><span class="em" title="${esc(x.email)}">${esc(x.email)}${x.owner?' <span class="tag">擁有者</span>':self?' <span class="tag">你</span>':''}</span>`+
      (lock?`<span class="tag">編輯</span>`:`<select class="btn"><option value="view"${x.role==='view'?' selected':''}>查看</option><option value="edit"${x.role==='edit'?' selected':''}>編輯</option></select><button class="btn" type="button">移除</button>`)+`</div>`;
  }).join('');
  $('aclList').querySelectorAll('.acl').forEach(el=>{
    const e=el.dataset.e, sel=el.querySelector('select'), del=el.querySelector('button');
    if(sel) sel.onchange=()=>aclDo('aclSet',{email:e,role:sel.value},`已將 ${e} 改為${sel.value==='edit'?'編輯':'查看'}`);
    if(del) del.onclick=()=>{
      if(del.dataset.c){aclDo('aclRemove',{email:e},`已移除 ${e}`)}
      else{del.dataset.c='1';del.textContent='確定移除？';del.style.color='var(--hi)';setTimeout(()=>{if(del.isConnected){delete del.dataset.c;del.textContent='移除';del.style.color=''}},3000)}
    };
  });
}
async function loadAcl(){
  $('aclList').innerHTML='<div class="note" style="padding:6px 0">讀取中⋯</div>';
  try{aclRender(await api('aclList'))}catch(err){$('aclList').innerHTML='';$('aclMsg').textContent=errText(err)}
}
async function aclDo(action,extra,okText){
  const m=$('aclMsg');m.style.color='';m.textContent='儲存中⋯';
  try{aclRender(await api(action,extra));m.textContent=okText+'，最多 5 分鐘內生效。'}
  catch(err){m.style.color='var(--hi)';m.textContent=errText(err);loadAcl()}
}
$('aclAdd').addEventListener('submit',e=>{e.preventDefault();const em=$('aclEmail').value.trim();if(!em)return;
  aclDo('aclSet',{email:em,role:$('aclRole').value},`已新增 ${em}`).then(()=>{$('aclEmail').value=''})});
$('closeUpload').onclick=()=>{$('ov').style.display='none'};
$('ov').addEventListener('click',e=>{if(e.target===$('ov'))$('ov').style.display='none'});

// ---------- 啟動 ----------
let googleAdded=false;
async function boot(){
  $('mapInfo').textContent='下載圖資中⋯';
  try{
    const r=await api('get');
    $('acct').style.display=''; $('acct').title=r.email+'（按此登出）'; ME=r.email;
    if(!googleAdded){googleAdded=true;try{addGoogleLayers(r.google)}catch(e){}}
    if(r.canEdit){$('openUpload').style.display='';$('src').value=r.source||''}
    DATA=null;
    if(r.data){const d=JSON.parse(r.data);DATA={name:d.name,updatedAt:r.updated,points:d.points||[]}}
    render();
    if(!DATA||!DATA.points.length) $('emptyMsg').textContent=r.canEdit?'還沒有圖資，按右上角「更換圖資」匯入。':'還沒有圖資。';
  }catch(err){
    if(token){DATA=null;render();$('mapInfo').textContent='無法讀取圖資';$('emptyMsg').textContent=errText(err)}
  }
}
if(!CFG.API_URL||!CFG.CLIENT_ID||/貼上/.test(CFG.API_URL+CFG.CLIENT_ID)){
  $('login').style.display='flex';$('loginMsg').textContent='系統尚未設定：請在 config.js 填入 API_URL 與 CLIENT_ID。';
}else if(token){$('login').style.display='none';boot()}
else showLogin();
})();
</script>
