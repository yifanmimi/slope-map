<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>邊坡圖資編號查詢</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d2320;--mute:#6b736f;--line:#dcdfdb;--acc:#1f6f5c;--acc2:#e3f1ec;--hi:#d9480f}
@media (prefers-color-scheme:dark){:root{--bg:#141716;--card:#1d2120;--ink:#e8ece9;--mute:#9aa39e;--line:#2f3532;--acc:#5cc2a3;--acc2:#1e3a32;--hi:#ff8a4c}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{padding:10px 12px 8px;background:var(--card);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:8px}
.title{flex:1;min-width:0}
.title b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title small{color:var(--mute);font-size:12px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.search{display:flex;gap:8px;margin-top:8px}
.search input{flex:1;min-width:0;font-size:20px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);outline:none}
.search input:focus{border-color:var(--acc)}
#results{max-height:34vh;overflow:auto;background:var(--card);border-bottom:1px solid var(--line);display:none}
.r{padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.r:active,.r:hover{background:var(--acc2)}
.r b{font-size:15px}.r span{color:var(--mute);font-size:12px;margin-left:6px}
.note{padding:10px 14px;color:var(--mute);font-size:13px}
#map{flex:1;min-height:200px;background:#e9ece8}
@media (prefers-color-scheme:dark){#map{background:#202624}}
#detail{background:var(--card);border-top:1px solid var(--line);padding:12px 14px;max-height:42vh;overflow:auto;display:none}
#detail h3{margin:0 0 4px;font-size:18px}
#detail .meta{color:var(--mute);font-size:12px;margin-bottom:8px}
#detail table{border-collapse:collapse;width:100%;font-size:14px;margin:6px 0}
#detail td{border-top:1px solid var(--line);padding:5px 4px;vertical-align:top}
#detail td:first-child{color:var(--mute);white-space:nowrap;width:1%;padding-right:10px}
#detail .desc{font-size:14px;white-space:pre-wrap;margin:6px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
a.btn{text-decoration:none;display:inline-block}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:2000;padding:16px}
.panel{background:var(--card);border-radius:16px;max-width:460px;width:100%;padding:18px;max-height:90vh;overflow:auto}
.panel h2{margin:0 0 8px;font-size:18px}
.panel ol{padding-left:20px;margin:8px 0;font-size:14px;line-height:1.7}
.panel p{font-size:14px;line-height:1.6;margin:8px 0}
#msg{font-size:14px;margin-top:8px;min-height:1.2em}
.leaflet-control-layers{font-size:14px}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:500;pointer-events:none}
.empty div{background:var(--card);padding:16px 18px;border-radius:14px;max-width:300px;text-align:center;font-size:14px;line-height:1.6;pointer-events:auto;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.leaflet-tooltip.lbl{background:transparent;border:0;box-shadow:none;color:var(--ink);font-size:11px;font-weight:600;padding:0;text-shadow:0 0 3px var(--bg),0 0 3px var(--bg)}
.leaflet-tooltip.lbl:before{display:none}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="title"><b id="mapName">邊坡圖資編號查詢</b><small id="mapInfo">載入中⋯</small></div>
    <button class="btn" id="openUpload">載入檔案</button>
  </div>
  <form class="search" id="sf">
    <input id="q" type="search" inputmode="search" placeholder="輸入編號，例如 NO035 或序號 310" autocomplete="off">
    <button class="btn pri" type="submit">定位</button>
  </form>
</header>
<div id="results"></div>
<div style="position:relative;flex:1;display:flex;flex-direction:column">
  <div id="map"></div>
  <div class="empty" id="empty" style="display:none"><div>還沒有圖資。<br>請把從 Google 我的地圖匯出的 KML 檔，命名為 map.kml 上傳到 GitHub。</div></div>
</div>
<div id="detail"></div>

<div class="overlay" id="ov">
  <div class="panel">
    <h2>更換圖資</h2>
    <p>從 Google 我的地圖匯出（需用電腦瀏覽器）：</p>
    <ol>
      <li>開啟地圖，點地圖名稱旁的「⋮」</li>
      <li>選「匯出至 KML/KMZ」</li>
      <li>圖層選「整份地圖」，不要勾「保持資料在最新狀態」</li>
      <li>下載後在這裡選擇檔案</li>
    </ol>
    <p style="color:var(--mute)">在這裡選的檔案只會暫時用在這台裝置。要讓所有人都換成新圖，請到 GitHub 把新檔案以 map.kml 的名稱上傳覆蓋。</p>
    <input type="file" id="file" accept=".kml,.kmz,application/vnd.google-earth.kml+xml,application/vnd.google-earth.kmz">
    <div id="msg"></div>
    <div class="row"><button class="btn" id="resetLocal" style="display:none">改回共用版圖資</button><button class="btn" id="closeUpload">關閉</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
let DATA=null; // {name, updatedAt, points:[...]}
let db=null, canWrite=null;
const LS_KEY='slope-map-local-v1';

// ---------- map ----------
const map=L.map('map',{zoomControl:true,preferCanvas:true,maxZoom:20}).setView([24.99,121.57],13);
const nlsc=(id,name)=>L.tileLayer('https://wmts.nlsc.gov.tw/wmts/'+id+'/default/GoogleMapsCompatible/{z}/{y}/{x}',{maxZoom:20,maxNativeZoom:id==='PHOTO2'?20:19,attribution:'國土測繪中心'});
const bases={'電子地圖':nlsc('EMAP'),'正射影像':nlsc('PHOTO2'),'OpenStreetMap':L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,maxNativeZoom:19,attribution:'© OpenStreetMap'})};
bases['電子地圖'].addTo(map);
L.control.layers(bases,null,{position:'topright'}).addTo(map);
map.attributionControl.setPrefix(false);
const layerAll=L.layerGroup().addTo(map);
let hiLayer=null, markers=[];
const css=getComputedStyle(document.documentElement);
const ACC=()=>css.getPropertyValue('--acc').trim()||'#1f6f5c';
const HI=()=>css.getPropertyValue('--hi').trim()||'#d9480f';
const PALETTE=['#1f6f5c','#2b6cb0','#9c4221','#6b46c1','#b7791f','#2c7a7b','#c53030','#4a5568','#2f855a','#975a16'];

function render(){
  layerAll.clearLayers(); markers=[]; if(hiLayer){map.removeLayer(hiLayer);hiLayer=null}
  $('detail').style.display='none';
  if(!DATA||!DATA.points.length){
    $('empty').style.display='flex';
    $('mapName').textContent='邊坡圖資編號查詢';
    $('mapInfo').textContent='尚無圖資';
    return;
  }
  $('empty').style.display='none';
  $('mapName').textContent=DATA.name||'邊坡圖資編號查詢';
  document.title=(DATA.name||'邊坡圖資')+'｜編號查詢';
  const d=DATA.updatedAt?new Date(DATA.updatedAt):null;
  $('mapInfo').textContent=DATA.points.length+' 筆'+(d?'・更新於 '+d.toLocaleDateString('zh-TW'):'')+(DATA.local?'・僅存在這台裝置':'');
  const layers=[...new Set(DATA.points.map(p=>p.l))];
  const bounds=[];
  DATA.points.forEach((p,i)=>{
    const col=p.s||PALETTE[layers.indexOf(p.l)%PALETTE.length];
    let m;
    if(p.g==='line'&&p.k) m=L.polyline(p.k,{color:col,weight:3});
    else if(p.g==='poly'&&p.k) m=L.polygon(p.k,{color:col,weight:2,fillOpacity:.15});
    else m=L.circleMarker(p.c,{radius:5,color:'#fff',weight:1,fillColor:col,fillOpacity:.95});
    m.on('click',ev=>{L.DomEvent.stopPropagation(ev);select(i,false)});
    m.addTo(layerAll); markers.push(m); bounds.push(p.c);
  });
  if(bounds.length) map.fitBounds(bounds,{padding:[20,20]});
  updateLabels();
}
// labels only when zoomed in enough, to keep 1000 points readable
let labelLayer=L.layerGroup().addTo(map);
function updateLabels(){
  labelLayer.clearLayers();
  if(!DATA) return;
  const z=map.getZoom(), b=map.getBounds();
  if(z<16) return;
  let n=0;
  for(const p of DATA.points){
    if(!b.contains(p.c)) continue;
    if(p.n==='(未命名)') continue;
    if(++n>300) break;
    L.tooltip({permanent:true,direction:'right',className:'lbl',offset:[6,0]}).setLatLng(p.c).setContent(esc(p.n)).addTo(labelLayer);
  }
}
map.on('zoomend moveend',updateLabels);
map.on('click',e=>{
  const ll=e.latlng.lat.toFixed(6)+','+e.latlng.lng.toFixed(6);
  L.popup().setLatLng(e.latlng).setContent(`<a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${ll}" target="_blank" rel="noopener">這裡的街景</a>`).openOn(map);
});

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function select(i,fly=true){
  const p=DATA.points[i];
  if(hiLayer) map.removeLayer(hiLayer);
  hiLayer=L.layerGroup([
    L.circleMarker(p.c,{radius:16,color:HI(),weight:3,fill:false}),
    L.circleMarker(p.c,{radius:7,color:'#fff',weight:2,fillColor:HI(),fillOpacity:1})
  ]).addTo(map);
  if(fly) map.setView(p.c,Math.max(map.getZoom(),17));
  const rows=Object.entries(p.f||{}).filter(([k,v])=>v!==''&&v!=null).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('');
  const ll=p.c[0].toFixed(6)+','+p.c[1].toFixed(6);
  $('detail').innerHTML=`<h3>${esc(p.n)}</h3><div class="meta">${esc(p.l)}・${ll}</div>`+
    (p.d?`<div class="desc">${esc(p.d)}</div>`:'')+(rows?`<table>${rows}</table>`:'')+
    `<div class="row"><a class="btn pri" href="https://www.google.com/maps/search/?api=1&query=${ll}" target="_blank" rel="noopener">在 Google 地圖開啟</a>`+
    `<a class="btn pri" href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${ll}" target="_blank" rel="noopener">街景</a>`+
    `<a class="btn" href="https://www.google.com/maps/dir/?api=1&destination=${ll}" target="_blank" rel="noopener">導航</a>`+
    `<button class="btn" id="cpy">複製座標</button></div>`;
  $('detail').style.display='block';
  const cb=$('cpy'); cb.onclick=()=>{try{navigator.clipboard.writeText(ll).then(()=>cb.textContent='已複製',()=>cb.textContent=ll)}catch(e){cb.textContent=ll}};
  setTimeout(()=>map.invalidateSize(),50);
}

// ---------- search ----------
function norm(s){return String(s??'').replace(/[！-～]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/　/g,' ').trim().toUpperCase()}
const IDKEY=/編號|序號|號碼|編碼|代碼|^ID$|ID$|^NO|NAME$|^SNUM$|^IDNO$|SN碼|樁號|^POS/i;
function strip0(v){return v.replace(/^[A-Z]*-?/,'').replace(/^0+(?=\d)/,'')}
function search(qRaw){
  const q=norm(qRaw); if(!q||!DATA) return {exact:[],part:[]};
  const qs=strip0(q);
  const exact=[],part=[];
  DATA.points.forEach((p,i)=>{
    const vals=[['名稱',p.n],...Object.entries(p.f||{}).filter(([k])=>IDKEY.test(k))].map(([k,v])=>[k,norm(v)]).filter(([,v])=>v);
    let hit=null;
    for(const [k,v] of vals){ if(v===q||(qs&&/\d/.test(qs)&&strip0(v)===qs)){hit=k;break} }
    if(hit){exact.push([i,hit]);return}
    if(q.length>=2&&(vals.some(([,v])=>v.includes(q))||Object.values(p.f||{}).some(v=>norm(v).includes(q)))) part.push([i,'']);
  });
  return {exact,part};
}
function showResults(res,q){
  const box=$('results');
  if(!q){box.style.display='none';return}
  const {exact,part}=res; let h='';
  if(!exact.length&&!part.length) h=`<div class="note">找不到「${esc(q)}」</div>`;
  else{
    const item=([i,tag])=>{const p=DATA.points[i];const tv=tag&&tag!=='名稱'?tag+' '+(p.f[tag]||''):'';return `<div class="r" data-i="${i}"><b>${esc(p.n)}</b><span>${esc(p.l)}${tv?'・'+esc(tv):''}</span></div>`};
    h=`<div class="note">符合 ${exact.length} 筆</div>`+exact.slice(0,100).map(item).join('');
    if(!exact.length) h='';
    if(part.length) h+=`<div class="note">部分符合（${part.length}）</div>`+part.slice(0,50).map(item).join('');
  }
  box.innerHTML=h; box.style.display='block';
  box.querySelectorAll('.r').forEach(el=>el.onclick=()=>{select(+el.dataset.i);box.style.display='none';$('q').blur()});
}
$('sf').addEventListener('submit',e=>{
  e.preventDefault(); const q=$('q').value; const res=search(q);
  if(!DATA){return}
  if(res.exact&&res.exact.length===1){select(res.exact[0][0]);$('results').style.display='none';$('q').blur()}
  else showResults(res,q);
});
$('q').addEventListener('input',()=>{const q=$('q').value; if(!q.trim()){$('results').style.display='none';return} showResults(search(q),q)});

// ---------- KML parsing ----------
function txt(el,tag){const x=el.getElementsByTagName(tag)[0];return x?x.textContent.trim():''}
function stripHtml(s){if(!s)return'';const d=new DOMParser().parseFromString('<div>'+s.replace(/<br\s*\/?>/gi,'\n')+'</div>','text/html');return (d.body.textContent||'').replace(/\n{3,}/g,'\n\n').trim()}
function coordsOf(s){return s.trim().split(/\s+/).map(t=>t.split(',').map(Number)).filter(a=>a.length>=2&&isFinite(a[0])&&isFinite(a[1])).map(a=>[+a[1].toFixed(6),+a[0].toFixed(6)])}
function thin(arr,max){if(arr.length<=max)return arr;const step=arr.length/max,out=[];for(let i=0;i<max;i++)out.push(arr[Math.floor(i*step)]);out.push(arr[arr.length-1]);return out}
const NAMEKEYS=['NoName','ASName','NEW NAME','POS_1','NoID','NOID','IDNo','序號'];
function parseKML(text){
  const xml=new DOMParser().parseFromString(text,'application/xml');
  if(xml.getElementsByTagName('parsererror').length) throw new Error('KML 檔案格式讀不懂');
  if(!xml.getElementsByTagName('Placemark').length&&xml.getElementsByTagName('NetworkLink').length) throw new Error('這是「保持資料在最新狀態」的連結檔，裡面沒有點位。請重新匯出，不要勾那個選項。');
  const doc=xml.getElementsByTagName('Document')[0];
  let name='';
  if(doc){for(const c of doc.children){if(c.localName==='name'){name=c.textContent.trim();break}}}
  const pts=[];
  for(const pm of xml.getElementsByTagName('Placemark')){
    let layer='';
    let par=pm.parentElement;
    while(par){if(par.localName==='Folder'){for(const c of par.children){if(c.localName==='name'){layer=c.textContent.trim();break}}break}par=par.parentElement}
    const f={};
    for(const d of pm.getElementsByTagName('Data')){const k=(d.getAttribute('name')||'').replace(/\uFFFD/g,'').trim();const v=txt(d,'value');if(k&&!/^gx_media_links$/i.test(k))f[k]=v.slice(0,300)}
    for(const d of pm.getElementsByTagName('SimpleData')){const k=d.getAttribute('name');if(k)f[k]=d.textContent.trim().slice(0,300)}
    let desc=stripHtml(txt(pm,'description'));
    // My Maps puts "key: value" lines in description too; drop duplicates of ExtendedData
    if(Object.keys(f).length){desc=desc.split('\n').filter(line=>{const m=line.match(/^([^:：]+)[:：]\s*(.*)$/);return !(m&&f[m[1].trim()]!==undefined)}).join('\n').trim()}
    let g='pt',c=null,k=null;
    const pt=pm.getElementsByTagName('Point')[0], ls=pm.getElementsByTagName('LineString')[0], pg=pm.getElementsByTagName('Polygon')[0];
    if(pt){c=coordsOf(txt(pt,'coordinates'))[0]}
    else if(ls){k=thin(coordsOf(txt(ls,'coordinates')),150);g='line';c=k[Math.floor(k.length/2)]}
    else if(pg){const ob=pg.getElementsByTagName('outerBoundaryIs')[0]||pg;k=thin(coordsOf(txt(ob,'coordinates')),150);g='poly';
      if(k.length){let a=0,b=0;k.forEach(q=>{a+=q[0];b+=q[1]});c=[+(a/k.length).toFixed(6),+(b/k.length).toFixed(6)]}}
    if(!c) continue;
    let nm=txt(pm,'name');
    if(!nm){for(const key of NAMEKEYS){if(f[key]){nm=key==='POS_1'&&f.IDNo?f.IDNo+'-'+f[key]:f[key];break}}}
    const o={n:nm||'(未命名)',l:layer||'圖層',c,g};
    const sm=(txt(pm,'styleUrl').match(/-([0-9A-F]{6})-/i)||[])[1]; if(sm)o.s='#'+sm;
    if(k&&g!=='pt')o.k=k;
    if(desc)o.d=desc.slice(0,500);
    if(Object.keys(f).length)o.f=f;
    pts.push(o);
  }
  if(!pts.length) throw new Error('檔案裡找不到任何點位');
  return {name,points:pts};
}
async function readFile(file){
  if(/\.kmz$/i.test(file.name)||file.type.includes('kmz')){
    const zip=await JSZip.loadAsync(file);
    const k=Object.keys(zip.files).find(n=>/\.kml$/i.test(n));
    if(!k) throw new Error('KMZ 裡找不到 KML');
    return zip.files[k].async('string');
  }
  return file.text?file.text():new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsText(file)});
}

// ---------- storage ----------
const LS_KEY2='slope-map-override-v1';
function saveLocal(parsed){
  DATA={name:parsed.name,updatedAt:new Date().toISOString(),points:parsed.points,local:true};
  try{localStorage.setItem(LS_KEY2,JSON.stringify(DATA))}catch(e){}
  render(); $('resetLocal').style.display='inline-block';
}
$('file').addEventListener('change',async e=>{
  const file=e.target.files[0]; if(!file) return;
  const msg=$('msg'); msg.style.color=''; msg.textContent='讀取中⋯';
  try{const parsed=parseKML(await readFile(file));saveLocal(parsed);msg.textContent=`完成，共 ${parsed.points.length} 筆（只在這台裝置）。`;setTimeout(()=>{$('ov').style.display='none'},900)}
  catch(err){msg.style.color='var(--hi)';msg.textContent=(err&&err.message)||'讀取失敗'}
  e.target.value='';
});
$('resetLocal').onclick=()=>{try{localStorage.removeItem(LS_KEY2)}catch(e){}$('resetLocal').style.display='none';$('ov').style.display='none';loadShared()};
$('openUpload').onclick=()=>{$('msg').textContent='';$('ov').style.display='flex'};
$('closeUpload').onclick=()=>{$('ov').style.display='none'};
$('ov').addEventListener('click',e=>{if(e.target===$('ov'))$('ov').style.display='none'});

async function fetchFirst(){
  for(const f of ['map.kml','map.kmz']){
    try{const r=await fetch(f+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)continue;
      if(f.endsWith('kmz')){const zip=await JSZip.loadAsync(await r.blob());const k=Object.keys(zip.files).find(n=>/\.kml$/i.test(n));if(k)return{text:await zip.files[k].async('string'),mod:r.headers.get('last-modified')}}
      else return{text:await r.text(),mod:r.headers.get('last-modified')};
    }catch(e){}
  }
  return null;
}
async function loadShared(){
  $('mapInfo').textContent='下載圖資中⋯';
  const got=await fetchFirst();
  if(!got){DATA=null;render();$('mapInfo').textContent='找不到 map.kml';return}
  try{const parsed=parseKML(got.text);DATA={name:parsed.name,updatedAt:got.mod||null,points:parsed.points};render()}
  catch(err){DATA=null;render();$('mapInfo').textContent='map.kml 讀取失敗：'+err.message}
}
// ---------- boot ----------
(function(){
  let local=null;try{const s=localStorage.getItem(LS_KEY2);if(s)local=JSON.parse(s)}catch(e){}
  if(local){DATA=local;DATA.local=true;render();$('resetLocal').style.display='inline-block'}
  else loadShared();
})();
})();
</script>
</body>
</html>
